name: BuildFlow CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore tests/BuildFlow.Api.Tests/BuildFlow.Api.Tests.csproj
      - run: dotnet build src/BuildFlow.Api/BuildFlow.Api.csproj --configuration Release --no-restore
      - run: dotnet test tests/BuildFlow.Api.Tests/BuildFlow.Api.Tests.csproj --configuration Release --no-restore

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run build
